services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cgu_pipeline
    volumes:
      - ${DEPLOY_ROOT:-/srv/cgu-pipeline}/postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cgu_pipeline
      MINIO_ROOT_PASSWORD: cgu_pipeline_dev_password
    volumes:
      - ${DEPLOY_ROOT:-/srv/cgu-pipeline}/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  master:
    image: master:prod
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/cgu_pipeline}
      PORT: ${PORT:-4000}
      BUCKET_ENDPOINT_SCHEME: ${BUCKET_ENDPOINT_SCHEME:-http}
      BUCKET_ENDPOINT_HOST: ${BUCKET_ENDPOINT_HOST:-minio}
      BUCKET_ENDPOINT_PORT: ${BUCKET_ENDPOINT_PORT:-9000}
      BUCKET_REGION: ${BUCKET_REGION:-us-east-1}
      BUCKET_ACCESS_KEY_ID: ${BUCKET_ACCESS_KEY_ID:-cgu_pipeline}
      BUCKET_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY:-cgu_pipeline_dev_password}
      BUCKET_NAME: ${BUCKET_NAME:-cgu-pipeline-artifacts}
      BUCKET_REQUEST_TIMEOUT_MS: ${BUCKET_REQUEST_TIMEOUT_MS:-30000}
      MASTER_ACCESS_KEY: ${MASTER_ACCESS_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4000"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    depends_on:
      - master
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${DEPLOY_ROOT:-/srv/cgu-pipeline}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DEPLOY_ROOT:-/srv/cgu-pipeline}/caddy-data:/data
      - ${DEPLOY_ROOT:-/srv/cgu-pipeline}/caddy-config:/config
